<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0e1117">
    <title>BadiCharts — Professional Trading Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/chart.css">
    <link rel="stylesheet" href="css/toolbar.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/colorpicker.css">
    <link rel="stylesheet" href="css/indicator-modal.css">
    <link rel="stylesheet" href="css/chart-settings-modal.css">
</head>
<body>
    <div id="chart-root"></div>
    <script>
        // FIX: Capture runtime errors so tests can verify chart loads cleanly
        window.__errors = [];
        window.addEventListener('error', (e) => {
            window.__errors.push({ message: e.message, source: e.filename, line: e.lineno, col: e.colno });
        });
        window.addEventListener('unhandledrejection', (e) => {
            window.__errors.push({ message: 'Unhandled rejection: ' + (e.reason && (e.reason.message || e.reason)), source: 'promise', line: 0, col: 0 });
        });
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
